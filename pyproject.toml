[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coolcode"
version = "0.1.0"
description = "A smarter CLI coding agent with swarm intelligence, built on LangChain Deep Agents"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "deepagents>=0.4.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.3.0",
    "hnswlib>=0.8.0",
    "networkx>=3.2",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.5.0",
    "sqlite-utils>=3.36",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=2.6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3.0",
]

[project.scripts]
coolcode = "coolcode.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coolcode*"]

[tool.ruff]
line-length = 100
target-version = "py311"
